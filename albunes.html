<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deezer Manager - App</title>
    <link rel="stylesheet" href="./styleDeezer.css">
</head>

<body>
    <div class="app-container">
        <div class="Pagebuffer">
            <h2>Deezer Manager</h2>
            <button id="darkSkin" class="Button_Modo_Oscuro">Modo Oscuro</button>
            <button id="Cerrar" class="Cerrar">Cerrar Sesión</button>
        </div>
        <aside class="sidebar">
            <section class="my-albums-section">
                <h3>Mis Álbumes</h3>
                <div class="filter-group">
                    <label for="filtro-rating">Filtrar por estrellas: </label>
                    <select id="filtro-rating">
                        <option value="todos">Todos</option>
                        <option value="5">5 Estrellas</option>
                        <option value="4">4 Estrellas</option>
                        <option value="3">3 Estrellas</option>
                        <option value="2">2 Estrellas</option>
                        <option value="1">1 Estrella</option>
                    </select>
                </div>

                <div id="contenedor-favoritos" class="albums-grid"></div>
            </section>
        </aside>
        <div class="mainContent">
            <div class="search-section">
                <form id="form-buscador" class="form-buscador">
                    <input type="text" id="input-busqueda" placeholder="Buscar artista..." required>
                    <button type="submit" id="btn-buscar">Buscar</button>
                </form>
            </div>

            <div id="spinner-busqueda" class="spinner hidden"></div>
            <div id="mensaje-estado" class="estado-mensaje hidden"></div>

            <div id="resultados-busqueda" class="resultados-grid"></div>

            <div id="detalle-artista" class="detalle-contenedor hidden">
                <button id="btn-volver" class="Button_Modo_Oscuro btn-volver">⬅ Volver</button>
                <div id="info-artista" class="info-artista"></div>
                <h3>Álbumes</h3>
                <div id="albumes-artista" class="albumes-list"></div>
            </div>

            <div id="reproductor-contenedor" class="reproductor-fijo hidden">
                <div class="reproductor-info">
                    <img id="reproductor-img" src="" alt="Portada">
                    <div class="reproductor-textos">
                        <p id="reproductor-titulo">Título</p>
                        <p id="reproductor-artista">Artista</p>
                    </div>
                </div>
                <audio id="reproductor-audio" controls name="media"></audio>
                <button id="btn-cerrar-reproductor" class="btn-cerrar">✕</button>
            </div>
        </div>
        </main>

    </div>
    <script src="misalbunes.js?v=3"></script>
    <script src="buscador.js?v=2"></script>
</body>

</html>
