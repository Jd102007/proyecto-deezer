<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deezer Manager</title>
    <link rel="stylesheet" href="./styleDeezer.css">
</head>
<body>
<div class="Pagebuffer">
    <header>
        <h1>Deezer Manager</h1>
    </header>
</div>
<button class="Button_Modo_Oscuro"tabindex="0" id="darkSkin"> Modo Oscuro</button>
<div class="subContent">
    <section id="login">
        <h3>Acceso (Login)</h3>
        <form id="form-login">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" id="btn-ingresar">Ingresar</button>
            

        </form>

    
  <div id="spinner" class="spinner hidden"></div>
    </section>
</div>      
<script src="loginDeezer.js"></script>
</body>
</html>
